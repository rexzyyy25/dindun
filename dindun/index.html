<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#000;color:#fff;overflow-x:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;font-family:'Poppins',sans-serif;
  }

  /* ===== CONTAINER MOBILE ===== */
  .scene{
    position:relative;
    width:100%;
    max-width:430px;
    height:100vh;
    max-height:932px;
    margin:0 auto;
    background: #05050a;
    overflow-y:auto;
    overflow-x:hidden;
    box-shadow:0 0 70px rgba(0,0,0,0.7);
    scroll-behavior: smooth;
  }
  @media(min-width:431px){ .scene{ border-radius:18px; } }

  .scene::-webkit-scrollbar, .letter-card::-webkit-scrollbar { width: 4px; }
  .scene::-webkit-scrollbar-track, .letter-card::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  .scene::-webkit-scrollbar-thumb, .letter-card::-webkit-scrollbar-thumb { background: rgba(255,140,190,0.3); border-radius: 4px; }

  /* ===== GLOBAL SECTION STYLES ===== */
  .section {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease-in-out;
    z-index: 2;
    display: none;
    flex-direction: column;
    align-items: center;
  }
  .section.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 5;
    display: flex;
  }

  .section.scrollable {
    position: relative;
    height: auto;
    min-height: 100%;
  }

  /* ===== SECTION 1: GARDEN + BINTANG ===== */
  #sec1 {
    background:
      radial-gradient(ellipse at 50% 15%, rgba(80,20,65,0.4), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(8,40,18,0.5), transparent 62%),
      #05050a;
  }

  .stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index: 1;
  }
  .star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    animation:twinkle 3s ease-in-out infinite;
    opacity:.5;
  }
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:1;transform:scale(1.6);}}

  .header{position:relative;z-index:6;text-align:center;padding-top:10vh;}
  .title{
    font-family:'Dancing Script',cursive;font-weight:700;font-size:2.5rem;color:#fff;letter-spacing:1px;
    text-shadow:0 0 6px rgba(255,255,255,.55),0 0 16px rgba(255,140,190,.65),0 0 34px rgba(255,90,160,.5);
    animation:glow 3.5s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{text-shadow:0 0 6px rgba(255,255,255,.5),0 0 16px rgba(255,140,190,.55),0 0 30px rgba(255,90,160,.4);}50%{text-shadow:0 0 10px rgba(255,255,255,.75),0 0 22px rgba(255,140,190,.85),0 0 44px rgba(255,90,160,.65);}}
  .subtitle{margin-top:8px;font-size:.6rem;letter-spacing:3px;color:#8a8a95;text-transform:uppercase;}

  .garden{position:absolute;left:0;right:0;bottom:0;height:64%;z-index:3;}
  .garden-svg{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible;}

  .stem-path{
    stroke-dasharray:420;stroke-dashoffset:420;
    animation-name:grow;animation-timing-function:cubic-bezier(0.25, 1, 0.5, 1);animation-fill-mode:forwards;
  }
  @keyframes grow{to{stroke-dashoffset:0;}}

  .leaf-grow{
    transform-box:fill-box;transform-origin:0 0;transform:scale(0);opacity:0;
    animation-name:leafgrow;animation-duration:0.8s;animation-timing-function:cubic-bezier(0.16, 1, 0.3, 1);animation-fill-mode:forwards;
  }
  @keyframes leafgrow{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:0.78;}}

  .petals{
    transform-box:fill-box;transform-origin:50% 100%;transform:scale(0.1) rotate(-8deg);opacity:0;
    animation-name:bloom;animation-duration:1.4s;animation-timing-function:cubic-bezier(0.2, 0.9, 0.3, 1);animation-fill-mode:forwards;
    filter:drop-shadow(0 7px 6px rgba(0,0,0,.4));
  }
  @keyframes bloom{0%{transform:scale(0.1) rotate(-8deg);opacity:0;}50%{opacity:1;}100%{transform:scale(1) rotate(0deg);opacity:1;}}

  .inner-glow{animation:innerPulse 3s ease-in-out infinite;}
  @keyframes innerPulse{0%,100%{opacity:.45;}50%{opacity:.75;}}

  .sway-center,.sway-left,.sway-right{transform-box:fill-box;}
  .sway-center{transform-origin:50% 100%;animation:swayC 4.6s ease-in-out infinite;animation-delay:2.3s;}
  .sway-left{transform-origin:50% 100%;animation:swayL 5s ease-in-out infinite;animation-delay:1.3s;}
  .sway-right{transform-origin:50% 100%;animation:swayR 4.2s ease-in-out infinite;animation-delay:1.7s;}
  @keyframes swayC{0%,100%{transform:rotate(-1.4deg);}50%{transform:rotate(1.4deg);}}
  @keyframes swayL{0%,100%{transform:rotate(1.4deg);}50%{transform:rotate(-2deg);}}
  @keyframes swayR{0%,100%{transform:rotate(-1.8deg);}50%{transform:rotate(1.2deg);}}

  .blade-grow{
    transform-box:fill-box;transform-origin:0 100%;transform:scaleY(0);
    animation-name:bladegrow;animation-duration:1.1s;animation-timing-function:cubic-bezier(0.1, 0.8, 0.2, 1);animation-fill-mode:forwards;
  }
  @keyframes bladegrow{to{transform:scaleY(1);}}

  .firefly{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle, #fff8d0 0%, #ffe27a 40%, rgba(255,210,90,0) 75%);
    box-shadow:0 0 8px 2px rgba(255,220,120,.8);
    pointer-events:none;z-index:7;opacity:0;
    animation:fireflyFloat 4.5s ease-in-out infinite;
  }
  @keyframes fireflyFloat{
    0%{opacity:0;transform:translate(0,0) scale(.5);}
    15%{opacity:1;}
    50%{opacity:.85;transform:translate(6px,-22px) scale(1);}
    75%{opacity:.6;transform:translate(-5px,-34px) scale(.8);}
    100%{opacity:0;transform:translate(4px,-48px) scale(.4);}
  }

  .cta-wrap{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;z-index:8;}
  .cta{
    display:inline-flex;align-items:center;gap:8px;padding:11px 26px;border-radius:999px;
    border:1px solid rgba(255,140,190,.4);background:rgba(25,15,30,.6);backdrop-filter:blur(8px);
    color:#e8fff0;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
    transition:.3s;animation:pulseBtn 2.8s ease-in-out infinite;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .cta:hover{background:rgba(50,25,50,.8);border-color:rgba(255,160,200,.8);transform:translateY(-2px);}
  .cta svg{width:14px;height:14px;}
  @keyframes pulseBtn{0%,100%{box-shadow:0 0 0px rgba(255,140,190,0);}50%{box-shadow:0 0 16px rgba(255,140,190,.35);}}

  /* ===== PARTIKEL LOVE & CONTAINER ===== */
  .love-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: hidden;
  }
  .floating-particle {
    position: absolute;
    bottom: -20px;
    pointer-events: none;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
    15% { opacity: 0.8; }
    85% { opacity: 0.8; }
    100% { transform: translateY(-105vh) scale(1.2) rotate(360deg); opacity: 0; }
  }

  /* ===== ANIMASI KUPU-KUPU ===== */
  .butterfly {
    position: absolute;
    pointer-events: none;
    z-index: 5;
    animation: butterflyFlyFromCenter ease-in-out forwards;
    perspective: 600px;
  }

  .butterfly-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 8px var(--glow-color, rgba(255, 140, 190, 0.9)));
  }

  .wing-left-wrap {
    transform-origin: 25px 25px;
    animation: flapLeft 0.15s ease-in-out infinite alternate;
  }
  .wing-right-wrap {
    transform-origin: 25px 25px;
    animation: flapRight 0.15s ease-in-out infinite alternate;
  }

  @keyframes flapLeft {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(65deg); }
  }
  @keyframes flapRight {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(-65deg); }
  }

  @keyframes butterflyFlyFromCenter {
    0% {
      opacity: 0;
      transform: translate(0, 0) rotate(0deg) scale(0.2);
    }
    15% {
      opacity: 1;
      transform: translate(var(--sway1, 20px), var(--fly-y1, -40px)) rotate(15deg) scale(var(--b-scale, 1));
    }
    45% {
      transform: translate(var(--sway2, -50px), var(--fly-y2, -120px)) rotate(-20deg) scale(var(--b-scale, 1));
    }
    75% {
      opacity: 1;
      transform: translate(var(--sway3, 40px), var(--fly-y3, -220px)) rotate(10deg) scale(var(--b-scale, 1));
    }
    100% {
      opacity: 0;
      transform: translate(var(--sway4, -30px), var(--fly-y4, -320px)) rotate(-15deg) scale(var(--b-scale, 1));
    }
  }

  /* ===== SECTION 2: NOTEBOOK LETTER ===== */
  #sec2 {
    background: transparent;
    justify-content: center;
    padding: 20px 18px;
    height: 100%;
  }
  .letter-card {
    position: relative;
    width: 100%;
    max-width: 380px;
    height: 62vh;
    max-height: 500px;
    background: rgba(15, 10, 25, 0.75);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    border: 1px solid rgba(255, 140, 190, 0.25);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 100, 180, 0.05);
    padding: 24px 20px 20px 20px;
    margin-bottom: 24px;
    line-height: 32px; 
    background-image: linear-gradient(rgba(255, 140, 190, 0.15) 1px, transparent 1px);
    background-size: 100% 32px;
    background-position: 0 21px;
    overflow-y: auto;
    z-index: 3;
  }
  .envelope-icon {
    position: absolute;
    top: 14px; right: 18px;
    width: 22px; height: 22px;
    color: #ff8fb8;
    filter: drop-shadow(0 0 4px rgba(255,140,190,0.6));
  }
  .letter-content {
    font-size: 0.85rem;
    color: #f3e8f4;
    font-weight: 300;
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: 0.2px;
    display: inline;
  }

  /* ===== SECTION 3: PHOTO GALLERY ===== */
  #sec3 {
    background: transparent;
    padding: 30px 18px 40px 18px;
    align-items: center;
    justify-content: flex-start;
  }
  .gallery-header {
    font-size: 1.25rem;
    font-weight: 700;
    color: #ff8fb8;
    text-shadow: 0 0 10px rgba(255,77,148,0.8), 0 0 20px rgba(255,77,148,0.4);
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 1.5px;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .gallery-container {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 24px;
    z-index: 3;
  }
  .photo-card {
    position: relative;
    background: rgba(18, 10, 24, 0.7);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    border: 1px solid rgba(255, 140, 190, 0.3);
    padding: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5), inset 0 0 15px rgba(255, 140, 190, 0.08);
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .photo-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 140, 190, 0.7);
  }
  .photo-wrapper {
    position: relative;
    width: 100%;
    height: 380px;
    border-radius: 12px;
    overflow: hidden;
  }
  .photo-wrapper img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .zoom-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .photo-card:hover .zoom-overlay { opacity: 1; }
  .zoom-icon {
    width: 32px; height: 32px;
    color: #fff;
    background: rgba(255, 140, 190, 0.4);
    backdrop-filter: blur(4px);
    padding: 6px;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  .photo-caption {
    margin-top: 10px;
    text-align: center;
    font-size: 0.82rem;
    color: #f3e8f4;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* MODAL ZOOM */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 10, 0.92);
    backdrop-filter: blur(15px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content {
    position: relative;
    max-width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .modal-content img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(255, 140, 190, 0.3);
    object-fit: contain;
  }
  .modal-close {
    position: absolute;
    top: -45px; right: 0;
    background: none;
    border: none;
    color: #ff4d94;
    font-size: 2rem;
    cursor: pointer;
    filter: drop-shadow(0 0 8px #ff4d94);
    line-height: 1;
  }

  /* ===== SECTION 4: OUTRO ===== */
  #sec4 {
    background: transparent;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  
  .outro-box {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 40px;
    min-width: 280px;
  }

  .clamp-line {
    position: absolute;
    top: 50%;
    width: 6px;
    height: 70px;
    background: #ffffff;
    box-shadow: 0 0 12px #ffffff, 0 0 24px rgba(255,255,255,0.9), 0 0 40px rgba(255, 46, 147, 0.9);
    border-radius: 6px;
    transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 5;
    display: none; 
  }

  .clamp-line.left {
    left: 0px;
    transform: translateY(-50%) translateX(0px);
  }

  .clamp-line.right {
    right: 0px;
    transform: translateY(-50%) translateX(0px);
  }

  .outro-box.clamping .clamp-line.left {
    transform: translateY(-50%) translateX(var(--move-left, 120px));
  }

  .outro-box.clamping .clamp-line.right {
    transform: translateY(-50%) translateX(var(--move-right, -120px));
  }

  .outro-text {
    font-size: 2.3rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ff2e93;
    text-shadow: 0 0 15px rgba(255, 46, 147, 0.9), 0 0 30px rgba(255, 46, 147, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    transition: opacity 0.1s ease, transform 0.1s ease;
  }
  
  .outro-text.crushed {
    opacity: 0 !important;
    transform: scaleX(0) scaleY(1.3) !important;
  }

  .flat-heart {
    width: 1.3em;
    height: 1.3em;
    fill: #ff003c;
    vertical-align: middle;
    margin: 0 8px;
    display: inline-block;
    filter: drop-shadow(0 0 10px rgba(255,0,60,0.8));
  }

  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
    animation: explodeSpark 0.3s ease-out forwards;
  }

  @keyframes explodeSpark {
    0% {
      opacity: 1;
      transform: translate(0, 0) scale(1.3);
    }
    100% {
      opacity: 0;
      transform: translate(var(--tx), var(--ty)) scale(0);
    }
  }
</style>
</head>
<body>

<!-- LAGU AAC DIPASANG DI SINI -->
<audio id="bg-music" src="lagu.aac" loop></audio>

<div class="scene" id="scene">

  <!-- SECTION 1 (TAMAN & BUNGA) -->
  <div class="section active" id="sec1">
    <div class="stars" id="stars"></div>

    <div class="header">
      <div class="title">Special Gift</div>
      <div class="subtitle">To someone special in my life ✨</div>
    </div>

    <div class="garden">
      <svg class="garden-svg" id="gardenSvg" viewBox="0 0 400 320" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5fc267"/>
            <stop offset="45%" stop-color="#227a37"/>
            <stop offset="100%" stop-color="#0a2914"/>
          </linearGradient>
          <linearGradient id="grassGradDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a8f48"/>
            <stop offset="50%" stop-color="#1a5c2c"/>
            <stop offset="100%" stop-color="#071f0f"/>
          </linearGradient>
          <linearGradient id="leafGradA" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#0e3d1c"/>
            <stop offset="55%" stop-color="#2f8a44"/>
            <stop offset="100%" stop-color="#8fe98f"/>
          </linearGradient>
          <linearGradient id="leafGradB" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#123f1a"/>
            <stop offset="55%" stop-color="#37953f"/>
            <stop offset="100%" stop-color="#9be792"/>
          </linearGradient>

          <radialGradient id="petalPink" cx="50%" cy="15%" r="90%">
            <stop offset="0%" stop-color="#ffeef5"/>
            <stop offset="30%" stop-color="#ff8fb8"/>
            <stop offset="72%" stop-color="#ff4d94"/>
            <stop offset="100%" stop-color="#b81f58"/>
          </radialGradient>
          <radialGradient id="petalPinkSoft" cx="50%" cy="15%" r="90%">
            <stop offset="0%" stop-color="#fff4f7"/>
            <stop offset="32%" stop-color="#ffb1cd"/>
            <stop offset="74%" stop-color="#ff7fa8"/>
            <stop offset="100%" stop-color="#c93d70"/>
          </radialGradient>
          <radialGradient id="petalYellow" cx="50%" cy="15%" r="90%">
            <stop offset="0%" stop-color="#fffaea"/>
            <stop offset="32%" stop-color="#ffd166"/>
            <stop offset="74%" stop-color="#ffa53d"/>
            <stop offset="100%" stop-color="#d96b1a"/>
          </radialGradient>
          <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fffdf0" stop-opacity="0.95"/>
            <stop offset="45%" stop-color="#ffe9a8" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="stamenGlow" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#fffdf3"/>
            <stop offset="60%" stop-color="#ffe9a8"/>
            <stop offset="100%" stop-color="#f2b64a"/>
          </radialGradient>

          <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="4.5"/>
          </filter>
          <filter id="softBlurSmall" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="1.6"/>
          </filter>
        </defs>

        <g id="grassBack"></g>

        <!-- LEFT STEM -->
        <g class="sway-left">
          <path class="stem-path" d="M200,300 L100,90" stroke="#8B5A2B" stroke-width="3.8" fill="none" stroke-linecap="round" style="animation-duration:1.4s;animation-delay:.15s;"/>
          <g transform="translate(185,269) rotate(-50)"><g class="leaf-grow" style="animation-delay:.4s"><path d="M0,0 C9,-20 36,-20 52,0 C36,20 9,20 0,0 Z" fill="url(#leafGradA)" opacity="0.78" transform="scale(1.3)"/></g></g>
          <g transform="translate(170,237) rotate(130)"><g class="leaf-grow" style="animation-delay:.6s"><path d="M0,0 C8,-18 33,-18 48,0 C33,18 8,18 0,0 Z" fill="url(#leafGradB)" opacity="0.78" transform="scale(1.18)"/></g></g>
          <g transform="translate(155,206) rotate(-50)"><g class="leaf-grow" style="animation-delay:.8s"><path d="M0,0 C7,-16 29,-16 42,0 C29,16 7,16 0,0 Z" fill="url(#leafGradA)" opacity="0.78" transform="scale(1.02)"/></g></g>
          <g transform="translate(140,174) rotate(130)"><g class="leaf-grow" style="animation-delay:1s"><path d="M0,0 C6,-14 25,-14 36,0 C25,14 6,14 0,0 Z" fill="url(#leafGradB)" opacity="0.78" transform="scale(0.88)"/></g></g>
          <g transform="translate(128,149) rotate(-50)"><g class="leaf-grow" style="animation-delay:1.15s"><path d="M0,0 C5,-12 21,-12 30,0 C21,12 5,12 0,0 Z" fill="url(#leafGradA)" opacity="0.78" transform="scale(0.74)"/></g></g>
          <g transform="translate(117,126) rotate(130)"><g class="leaf-grow" style="animation-delay:1.3s"><path d="M0,0 C4,-10 17,-10 24,0 C17,10 4,10 0,0 Z" fill="url(#leafGradB)" opacity="0.78" transform="scale(0.62)"/></g></g>

<script>
  const NS = 'http://www.w3.org/2000/svg';

  // ===== FOTO JPEG DISESUAIKAN DI SINI =====
  const photosData = [
    {
      url: "foto1.jpeg",
      caption: "Have a wonderful day! FROM ME 💖"

    {

  // Bintang
  const starsEl = document.getElementById('stars');
  for(let i=0;i<90;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    const size = Math.random()*2+1;
    s.style.width = size+'px'; s.style.height = size+'px';
    s.style.animationDelay = (Math.random()*4)+'s';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    starsEl.appendChild(s);
  }

  // Rumput & Bunga
  function buildGrass(count, minH, maxH, baseY){
    const g = document.getElementById('grassBack');
    for(let i=0;i<count;i++){
      let x = Math.random()*400;
      if(x>185 && x<215 && Math.random()<0.6){ x = x<200 ? x-35 : x+35; }
      const height = minH + Math.random()*(maxH-minH);
      const curve = (Math.random()*80-40);
      const width = 2.4 + Math.random()*3.2;
      const grad = Math.random()>0.5 ? 'url(#grassGrad)' : 'url(#grassGradDark)';
      const delay = (Math.random()*1.2).toFixed(2);
      const y = baseY + (Math.random()*8-4);

      const outer = document.createElementNS(NS,'g');
      outer.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
      const inner = document.createElementNS(NS,'g');
      inner.setAttribute('class','blade-grow');
      inner.style.animationDelay = delay+'s';
      const path = document.createElementNS(NS,'path');
      path.setAttribute('d', `M${-width},0 Q${curve*0.5-width},${-height*0.5} ${curve},${-height} Q${curve*0.5+width},${-height*0.5} ${width},0 Z`);
      path.setAttribute('fill', grad);
      inner.appendChild(path);
      outer.appendChild(inner);
      g.appendChild(outer);
    }
  }
  buildGrass(52, 110, 240, 314);

  const fireflyEl = document.getElementById('fireflies');
  const fireflySpots = [
    {left:'16%', bottom:'175px'}, {left:'24%', bottom:'210px'},

  fireflySpots.forEach((p,i)=>{
    const f = document.createElement('div');
    f.className='firefly';
    f.style.left = p.left;
    f.style.bottom = p.bottom;
    f.style.animationDelay = (i*0.5+2.2)+'s';
    f.style.animationDuration = (3.5+Math.random()*2)+'s';
    fireflyEl.appendChild(f);
  });

  // Partikel Love
  function createLoveParticle(targetContainerId) {
    const container = document.getElementById(targetContainerId);
    if (!container) return;
    
    const p = document.createElement('div');
    p.className = 'floating-particle';
    p.style.left = Math.random() * 90 + 5 + '%';
    p.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="#ff2a6d" style="filter:drop-shadow(0 0 5px #ff2a6d);"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
    
    const duration = 5 + Math.random() * 5;
    p.style.animationDuration = duration + 's';
    container.appendChild(p);
    
    setTimeout(() => { p.remove(); }, duration * 1000);
  }

  // Kupu-kupu
  function createButterfly(targetContainerId) {
    const container = document.getElementById(targetContainerId);
    if (!container) return;

    const b = document.createElement('div');
    b.className = 'butterfly';

    const palette = [
      { main: '#ff7ebb', glow: 'rgba(255, 126, 187, 0.9)' },
      { main: '#70e0ff', glow: 'rgba(112, 224, 255, 0.9)' },
      { main: '#ffd166', glow: 'rgba(255, 209, 102, 0.9)' },
      { main: '#e0aaff', glow: 'rgba(224, 170, 255, 0.9)' }
    ];
    const colorScheme = palette[Math.floor(Math.random() * palette.length)];

    const size = Math.floor(22 + Math.random() * 16); 
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.setProperty('--glow-color', colorScheme.glow);

    b.style.left = (Math.random() * 70 + 15) + '%';
    b.style.top = (Math.random() * 20 + 40) + '%'; 

    b.innerHTML = `
      <svg class="butterfly-svg" viewBox="0 0 50 50">
        <g class="wing-left-wrap">
          <path d="M 25 25 C 10 5, 0 15, 5 28 C 10 38, 22 32, 25 25 Z" fill="${colorScheme.main}" opacity="0.9"/>
          <path d="M 25 25 C 12 30, 2 38, 12 46 C 22 50, 24 35, 25 25 Z" fill="${colorScheme.main}" opacity="0.7"/>
          <circle cx="12" cy="20" r="2.5" fill="#ffffff" opacity="0.8"/>
        </g>
        <g class="wing-right-wrap">
          <path d="M 25 25 C 40 5, 50 15, 45 28 C 40 38, 28 32, 25 25 Z" fill="${colorScheme.main}" opacity="0.9"/>
          <path d="M 25 25 C 38 30, 48 38, 38 46 C 28 50, 26 35, 25 25 Z" fill="${colorScheme.main}" opacity="0.7"/>
          <circle cx="38" cy="20" r="2.5" fill="#ffffff" opacity="0.8"/>
        </g>
        <path d="M25,18 L25,32" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M25,18 L21,12 M25,18 L29,12" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
      </svg>
    `;

    const flyDir = Math.random() < 0.5 ? -1 : 1;
    const sway1 = (Math.random() - 0.5) * 120;
    const sway2 = (Math.random() - 0.5) * 180;
    const sway3 = (Math.random() - 0.5) * 160;
    const sway4 = (Math.random() - 0.5) * 140;

    const flyY1 = 60 * flyDir;
    const flyY2 = 140 * flyDir;
    const flyY3 = 230 * flyDir;
    const flyY4 = 320 * flyDir;

    const scale = (0.7 + Math.random() * 0.5).toFixed(2);

    b.style.setProperty('--sway1', `${sway1}px`);
    b.style.setProperty('--sway2', `${sway2}px`);
    b.style.setProperty('--sway3', `${sway3}px`);
    b.style.setProperty('--sway4', `${sway4}px`);

    b.style.setProperty('--fly-y1', `${flyY1}px`);
    b.style.setProperty('--fly-y2', `${flyY2}px`);
    b.style.setProperty('--fly-y3', `${flyY3}px`);
    b.style.setProperty('--fly-y4', `${flyY4}px`);

    b.style.setProperty('--b-scale', scale);

    const flyDuration = 6 + Math.random() * 4;
    b.style.animationDuration = flyDuration + 's';

    container.appendChild(b);

    setTimeout(() => { b.remove(); }, flyDuration * 1000);
  }

  setInterval(() => {
    if (document.getElementById('sec2').classList.contains('active')) createLoveParticle('love-sec2');

  // ===== PEMUTAR LAGU OTOMATIS =====
  const music = document.getElementById('bg-music');

  function openLetter() {

    if (music) {
      music.play().catch(e => console.log("Audio play blocked/error:", e));
    }
    
    document.getElementById('sec1').classList.remove('active');

    setTimeout(() => {
      document.getElementById('sec2').classList.add('active');
      startTypewriter();
    }, 600);

  function goToSection3() {
    document.getElementById('sec2').classList.remove('active');
    setTimeout(() => {
      const sec3 = document.getElementById('sec3');
      const scene = document.getElementById('scene');
      sec3.classList.add('active');

    document.getElementById('sec3').classList.remove('active');
    setTimeout(() => {
      document.getElementById('sec4').classList.add('active');
      startOutroAnimation();
    }, 600);

  const letterText = "Thank you for being such a strong and amazing person. I'm really proud of you. You've done so well until this very moment, chasing your dreams and fighting your own battles with grace. You always keep trying to stay on your own path and pursue what matters most. You never give up, even when deep down you're actually so tired.\n\nI truly believe that one day, you'll look back at all of this and smile proudly because you made it through every hard moment and every part of the process.\n\nNever forget to be grateful for how far you've come, and keep moving forward with a happy heart. May your days be filled with beautiful blessings and endless joy. Keep shining, beautiful soul... ✨";

  let letterIndex = 0;
  function startTypewriter() {
    const el = document.getElementById('typewriter-text');
    const card = document.querySelector('.letter-card');
    el.innerText = '';
    letterIndex = 0;
    
    function type() {
      if (letterIndex < letterText.length) {
        el.innerText = letterText.substring(0, letterIndex + 1);
        letterIndex++;
        card.scrollTop = card.scrollHeight;
        setTimeout(type, 30);
      }
    }
    type();
  }

  function loadGallery() {
    const container = document.getElementById('gallery-container');
    container.innerHTML = '';
    photosData.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.onclick = () => openModal(item.url);
      
      card.innerHTML = `
        <div class="photo-wrapper">
          <img src="${item.url}" alt="Memory">
          <div class="zoom-overlay">
            <svg class="zoom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>

  /* ===== ANIMASI JEPIT OUTRO ===== */
  let outroTimer = null;

  function createImpactExplosion() {
    const box = document.getElementById('outro-box');
    const sec = document.getElementById('sec4');
    const rect = box.getBoundingClientRect();
    const secRect = sec.getBoundingClientRect();

    const centerX = (rect.left + rect.width / 2) - secRect.left;
    const centerY = (rect.top + rect.height / 2) - secRect.top;

    const colors = ['#ff2e93', '#ff003c', '#ffffff', '#ff8fb8', '#ffd166'];

    for (let i = 0; i < 24; i++) {
      const spark = document.createElement('div');
      spark.className = 'spark';
      
      const color = colors[Math.floor(Math.random() * colors.length)];
      spark.style.background = color;
      spark.style.boxShadow = `0 0 8px ${color}`;

      spark.style.left = centerX + 'px';
      spark.style.top = centerY + 'px';

      const angle = Math.random() * Math.PI * 2;
      const distance = 35 + Math.random() * 80;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;

      spark.style.setProperty('--tx', `${tx}px`);
      spark.style.setProperty('--ty', `${ty}px`);

      sec.appendChild(spark);

      setTimeout(() => { spark.remove(); }, 300);
    }
  }

  function startOutroAnimation() {
    if(outroTimer) clearInterval(outroTimer);

    const box = document.getElementById('outro-box');
    const textEl = document.getElementById('outro-text');
    const heartSvg = `<svg class="flat-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

    const sequence = [
      `I LOVE YOU`,
      `I ${heartSvg} YOU`,
      `I ${heartSvg} U`,
      `${heartSvg}`
    ];

    let currentIndex = 0;
    textEl.innerHTML = sequence[0];

    function runClampCycle() {
      const boxWidth = box.offsetWidth;
      const moveDist = (boxWidth / 2) - 4;

      box.style.setProperty('--move-left', `${moveDist}px`);
      box.style.setProperty('--move-right', `${-moveDist}px`);

      box.classList.add('clamping');

      setTimeout(() => {
        textEl.classList.add('crushed');
        createImpactExplosion();
      }, 200);

      setTimeout(() => {
        currentIndex = (currentIndex + 1) % sequence.length;
        textEl.innerHTML = sequence[currentIndex];
      }, 300);

      setTimeout(() => {
        box.classList.remove('clamping');
        textEl.classList.remove('crushed');
      }, 400);
    }

    setTimeout(runClampCycle, 800);
    outroTimer = setInterval(runClampCycle, 1600);
  }
</script>

</body>
</html>
